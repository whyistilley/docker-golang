services:
  app:
    image: docker-go:latest
    build:
      context: ../.
      dockerfile: ./_build/dev.Dockerfile
    container_name: app
    env_file:
      - ../.env
    volumes:
      - ../:/usr/src/app
    depends_on:
      database:
        condition: service_healthy
  database:
    image: postgres:17.0-bookworm
    container_name: database
    env_file:
      - ../.env
    volumes:
      - ../scripts/db/:/docker-entrypoint-initdb.d/
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 30s
      retries: 3
      start_period: 0s
      timeout: 30s
